[project]
name = "ai-project"
version = "0.1.0"
description = "Retrieval-augmented generation assistant for RuneScape 3 PvME guides"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dagshub>=0.7.1",
    "fastapi>=0.141.1",
    "fastembed>=0.5.0",
    "langchain>=1.3.14",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "mlflow>=3.15.1",
    "numpy>=2.2.6",
    "ollama>=0.6.2",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "ranx>=0.3.21",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
